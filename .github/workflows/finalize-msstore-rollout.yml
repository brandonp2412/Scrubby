name: Finalize Microsoft Store rollout

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: scrubby-msstore-rollout
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID || secrets.MSSTORE_SELLER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        run: msstore reconfigure --tenantId $env:AZURE_TENANT_ID --clientId $env:AZURE_CLIENT_ID --clientSecret $env:AZURE_CLIENT_SECRET --sellerId $env:SELLER_ID

      - name: Finalize completed rollout
        id: finalize
        shell: pwsh
        run: ./scripts/finalize-msstore-rollout.ps1 -ProductId "9N17TVBTJWXD"

      - name: Disable finalization checks until the next Store publish
        if: steps.finalize.outputs.finalized == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'finalize-msstore-rollout.yml',
            });
