name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pubspec.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_SUMMARY_ONLY: true

jobs:
  quality-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: ./scripts/check.sh
      - run: flutter build web --release
      - run: flutter build appbundle --release

  generate-screenshots:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate ${{ matrix.device_type }} screenshots
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SCRUBBY_DEVICE_TYPE: ${{ matrix.device_type }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            ./scripts/ci-screenshots.sh ||
            { adb reconnect offline || true; adb wait-for-device; ./scripts/ci-screenshots.sh; }
      - name: Upload ${{ matrix.device_type }} screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.6.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Patrol device tests
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./scripts/ci-patrol.sh

  version-bump:
    if: github.event_name == 'push'
    needs: [quality-checks, generate-screenshots, patrol-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build_number: ${{ steps.bump.outputs.build_number }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download phone screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots
      - name: Download seven-inch screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots
      - name: Download ten-inch screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      - name: Bump versions and generate changelog
        id: bump
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          CURRENT_BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          CURRENT_MSIX=$(grep 'msix_version:' pubspec.yaml | sed 's/.*msix_version: *//')

          IFS='.' read -ra V <<< "$CURRENT_VERSION"
          NEW_VERSION="${V[0]}.${V[1]}.$((${V[2]} + 1))"
          NEW_BUILD=$((CURRENT_BUILD + 1))

          IFS='.' read -ra M <<< "$CURRENT_MSIX"
          NEW_MSIX="${M[0]}.${M[1]}.$((${M[2]} + 1)).${M[3]}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          sed -i "s/^version: .*/version: $NEW_VERSION+$NEW_BUILD/" pubspec.yaml
          sed -i "s/msix_version: .*/msix_version: $NEW_MSIX/" pubspec.yaml

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/$NEW_BUILD.txt"
          mkdir -p "$(dirname "$CHANGELOG_FILE")"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            git --no-pager log --pretty=format:'%s' "$LAST_TAG"..HEAD
          else
            git --no-pager log --pretty=format:'%s'
          fi | sort -u \
            | grep -v '^Merge ' \
            | grep -v '^Release ' \
            | grep -v '^Bump ' \
            | grep -v '\[skip ci\]' \
            | head -10 \
            | sed 's/^/• /' > "$CHANGELOG_FILE"
          [ -s "$CHANGELOG_FILE" ] || printf '%s\n' '• Bug fixes and improvements' > "$CHANGELOG_FILE"

          mkdir -p fastlane/metadata/en-AU assets/changelogs
          cp "$CHANGELOG_FILE" fastlane/metadata/en-AU/release_notes.txt
          cp "$CHANGELOG_FILE" "assets/changelogs/$(date +%s).txt"
      - name: Commit, tag, and push the tested release
        id: release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)

          git add pubspec.yaml fastlane/metadata assets/changelogs
          git commit -m "Release $VERSION [skip ci]"
          gh auth setup-git

          for attempt in 1 2 3; do
            git fetch origin main
            REMOTE_MAIN=$(git rev-parse origin/main)

            if [ "$REMOTE_MAIN" != "$BASE_SHA" ]; then
              if ! git merge-base --is-ancestor "$BASE_SHA" "$REMOTE_MAIN"; then
                echo "::error::main history diverged while preparing release $VERSION"
                exit 1
              fi

              UNSAFE_COMMITS=$(git log --format='%H %s' "$BASE_SHA..$REMOTE_MAIN" | grep -v '\[skip ci\]' || true)
              if [ -n "$UNSAFE_COMMITS" ]; then
                echo "::error::main advanced with untested commits; a newer CI run must release them"
                printf '%s\n' "$UNSAFE_COMMITS"
                exit 1
              fi

              UNSAFE_PATHS=$(git diff --name-only "$BASE_SHA" "$REMOTE_MAIN" | grep -Ev '^(\.github/|fastlane/metadata/android/en-US/images/|assets/changelogs/|AGENTS\.md$|[^/]+\.md$)' || true)
              if [ -n "$UNSAFE_PATHS" ]; then
                echo "::error::main advanced with [skip ci] changes that affect release inputs"
                printf '%s\n' "$UNSAFE_PATHS"
                exit 1
              fi

              git rebase "$REMOTE_MAIN"
              BASE_SHA="$REMOTE_MAIN"
            fi

            git tag -f "$VERSION"
            if git push --atomic origin HEAD:main "refs/tags/$VERSION"; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag -d "$VERSION" || true
            if [ "$attempt" -eq 3 ]; then
              echo "::error::main kept changing while publishing release $VERSION"
              exit 1
            fi
            sleep $((attempt * 2))
          done

  build-android:
    needs: version-bump
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && (secrets.ANDROID_STORE_PASSWORD != '' || secrets.ANDROID_KEYSTORE_PASSWORD != '') && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Configure Android upload signing
        if: env.ANDROID_SIGNING_READY == 'true'
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Note unsigned Android build
        if: env.ANDROID_SIGNING_READY != 'true'
        run: echo "::notice::Android signing secrets are not configured; GitHub release artifacts will be unsigned and Google Play publishing will be skipped."
      - run: flutter pub get --enforce-lockfile
      - name: Build Android release artifacts
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/scrubby.apk
          flutter build appbundle --release
      - name: Create Android checksums
        run: |
          sha256sum \
            build/app/outputs/flutter-apk/app-*-release.apk \
            build/app/outputs/flutter-apk/scrubby.apk \
            build/app/outputs/bundle/release/app-release.aab \
            > scrubby-${{ needs.version-bump.outputs.version }}.android.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/app/outputs/bundle/release/app-release.aab
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: scrubby-${{ needs.version-bump.outputs.version }}.sbom.cdx.json
      - name: Stage Android release files
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-*-release.apk release/android/
          cp build/app/outputs/flutter-apk/scrubby.apk release/android/
          cp build/app/outputs/bundle/release/app-release.aab release/android/
          cp scrubby-${{ needs.version-bump.outputs.version }}.android.sha256 release/android/
          cp scrubby-${{ needs.version-bump.outputs.version }}.sbom.cdx.json release/android/
      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: android-builds
          path: release/android/*

  build-linux:
    needs: version-bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Create Linux zip
        run: |
          cd build/linux/x64/release/bundle
          zip -r scrubby-linux.zip .
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: linux-builds
          path: build/linux/x64/release/bundle/scrubby-linux.zip

  build-windows:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Create Windows zip
        shell: pwsh
        run: Compress-Archive -Path ./build/windows/x64/runner/Release/* -DestinationPath ./scrubby-windows.zip
      - name: Build MSIX
        run: dart run msix:create
      - name: Stage Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows | Out-Null
          Copy-Item scrubby-windows.zip release/windows/
          Get-ChildItem build/windows/x64/runner/Release -File | Where-Object { $_.Extension -in '.msix', '.msixupload' } | Copy-Item -Destination release/windows/
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: windows-builds
          path: release/windows/*
          if-no-files-found: error

  create-github-release:
    needs: [version-bump, build-android, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version-bump.outputs.version }}
          name: ${{ needs.version-bump.outputs.version }}
          body_path: fastlane/metadata/en-AU/release_notes.txt
          files: |
            android-builds/*
            linux-builds/scrubby-linux.zip
            windows-builds/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-google-play:
    needs: [build-android, create-github-release]
    runs-on: ubuntu-24.04
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_PLAY_JSON_KEY }}
      ANDROID_SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && (secrets.ANDROID_STORE_PASSWORD != '' || secrets.ANDROID_KEYSTORE_PASSWORD != '') && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-builds
          path: android-release
      - name: Install Fastlane
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_SIGNING_READY == 'true'
        run: bundle install --jobs 4 --retry 3
      - name: Publish to Google Play
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_SIGNING_READY == 'true'
        env:
          SUPPLY_JSON_KEY_DATA: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android deploy aab:android-release/app-release.aab
      - name: Skip Google Play publish
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == '' || env.ANDROID_SIGNING_READY != 'true'
        run: echo "::notice::Google Play publishing skipped because Play credentials or Android signing credentials are not configured."

  deploy-windows-store:
    needs: [version-bump, build-windows, create-github-release]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID || secrets.MSSTORE_SELLER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false
      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-builds
          path: windows-release
      - name: Prepare Microsoft Store input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path store-package | Out-Null
          Get-ChildItem windows-release -File | Where-Object { $_.Extension -in '.msix', '.msixupload' } | Copy-Item -Destination store-package/
      - name: Setup .NET 9.0
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.SELLER_ID != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Setup Microsoft Store CLI
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.SELLER_ID != ''
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Configure Microsoft Store CLI
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.SELLER_ID != ''
        run: msstore reconfigure --tenantId $env:AZURE_TENANT_ID --clientId $env:AZURE_CLIENT_ID --clientSecret $env:AZURE_CLIENT_SECRET --sellerId $env:SELLER_ID
      - name: Prepare Microsoft Store for submission
        timeout-minutes: 45
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.SELLER_ID != ''
        shell: pwsh
        run: ./scripts/finalize-msstore-rollout.ps1 -ProductId "9N17TVBTJWXD"
      - name: Publish to Microsoft Store
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.SELLER_ID != ''
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem store-package -File | Where-Object { $_.Extension -in '.msix', '.msixupload' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX or MSIXUPLOAD package, found $($packages.Count)."
          }
          $packageDirectory = $packages[0].Directory.FullName
          & msstore publish . --inputDirectory $packageDirectory --appId 9N17TVBTJWXD --uploadTimeout 600 --verbose
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store publish failed with exit code $LASTEXITCODE."
          }
          & msstore submission status 9N17TVBTJWXD
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store submission status verification failed with exit code $LASTEXITCODE."
          }
      - name: Skip Microsoft Store publish
        if: env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == '' || env.SELLER_ID == ''
        run: Write-Host "::notice::Microsoft Store publishing skipped because Store credentials are not configured."

  sbom:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
