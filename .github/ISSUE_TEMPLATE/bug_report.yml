name: Bug report
description: Report a reproducible problem in Scrubby.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Home Assistant URLs, tokens, maps, or other private household data.
  - type: input
    id: version
    attributes:
      label: Scrubby version and platform
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
