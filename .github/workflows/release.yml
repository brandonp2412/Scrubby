name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  android:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Configure Android upload signing
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release
      - name: Create release checksum
        run: sha256sum build/app/outputs/bundle/release/app-release.aab > scrubby-${{ github.event.release.tag_name }}.aab.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/app/outputs/bundle/release/app-release.aab
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: scrubby-${{ github.event.release.tag_name }}.sbom.cdx.json
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/app/outputs/bundle/release/app-release.aab scrubby-${{ github.event.release.tag_name }}.aab.sha256 scrubby-${{ github.event.release.tag_name }}.sbom.cdx.json --clobber
