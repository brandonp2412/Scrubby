name: Windows MSIX

on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: Publish the generated package to Microsoft Store
        required: true
        default: false
        type: boolean
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-msix:
    # Store packages must be built from a tagged release, but retaining a
    # package build on PRs and master catches Windows-specific regressions.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Build MSIX
        run: dart run msix:create
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrubby-msix
          path: |
            build/windows/x64/runner/Release/*.msix
            build/windows/x64/runner/Release/*.msixupload
          if-no-files-found: error
          retention-days: 7

  publish-microsoft-store:
    needs: build-msix
    # Publishing is restricted to published v* GitHub releases. A maintainer
    # can also make an explicit manual retry after fixing Store metadata.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_store)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Store package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scrubby-msix
          path: store-package
      - name: Create release checksum
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $package = Get-ChildItem store-package -Recurse -File | Where-Object { $_.Extension -in '.msix', '.msixupload' } | Select-Object -First 1
          if ($null -eq $package) { throw 'No MSIX package was downloaded.' }
          (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLower() + "  " + $package.Name |
            Set-Content -NoNewline "scrubby-${{ github.event.release.tag_name }}.msix.sha256"
      - name: Upload Windows release artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem store-package -Recurse -File | Where-Object { $_.Extension -in '.msix', '.msixupload' } | ForEach-Object FullName)
          if ($packages.Count -eq 0) { throw 'No MSIX package was downloaded.' }
          gh release upload "${{ github.event.release.tag_name }}" $packages "scrubby-${{ github.event.release.tag_name }}.msix.sha256" --clobber
      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1
      - name: Configure Microsoft Store CLI
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} --sellerId ${{ secrets.SELLER_ID }}
      - name: Publish to Microsoft Store
        run: msstore publish --inputDirectory store-package --appId 9N17TVBTJWXD --packageRolloutPercentage 100
